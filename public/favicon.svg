<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#070709"/>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E28B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Outer Rhombus Diamond -->
  <polygon points="50,8 90,50 50,92 10,50" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round" fill="none"/>
  
  <!-- Central Perfume Drop -->
  <path d="M50 24 C50 24 68 45 68 60 C68 70 59.9 78 50 78 C40.1 78 32 70 32 60 C32 45 50 24 50 24 Z" fill="url(#gold)"/>
  
  <!-- Drop Inner Core Highlight -->
  <path d="M50 34 C50 34 60 48 60 57 C60 63 55.5 68 50 68 C44.5 68 40 63 40 57 C40 48 50 34 50 34 Z" fill="url(#glow)"/>
  
  <!-- Sparkle center -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF"/>
</svg>
